name: agent-evals

# 持续回归评估（测试阶段 stage-gate）
# 触发：改动 agent 配置/机构知识/评估套件时跑一遍；并定时例检。
# 说明：本工作流在 AINative 仓库跑 本仓库自包含 的 eval（evals/*.json，scope=repo）。
#       带 "project" 的 eval（指向其他仓库/项目）由该仓库自身的 CI 跑——本工作流会自动跳过，不会误判失败。

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AGENT.md'
      - 'agents/**'
      - 'evals/**'
      - 'tests/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/agent-evals.yml'
      - 'docs/playbook.md'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run eval suite
        run: ./evals/check.sh

  agent-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check core syntax
        run: npm run check
      - name: Test task state and persistence
        run: npm test
      - name: Test guards and eval runner
        run: npm run test:guards

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pull pinned sandbox image
        run: docker pull node:24-bookworm-slim
      - name: Verify Docker sandbox isolation
        run: npm run test:sandbox
